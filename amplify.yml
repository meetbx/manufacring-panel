
version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        - 'test -n "$NEXTAUTH_SECRET" || (echo "NEXTAUTH_SECRET is missing from Amplify environment variables" && exit 1)'
        - 'printf "NEXTAUTH_SECRET=%s\nNEXTAUTH_URL=%s\n" "$NEXTAUTH_SECRET" "$NEXTAUTH_URL" > .env.production'
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
